name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Rend le jar telechargeable depuis l'onglet "Actions" de GitHub,
      # meme sans creer de release.
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: cottonmod-jar
          path: build/libs/*.jar

      # Si le push est un tag (ex: v1.7.1), cree automatiquement une Release GitHub
      # avec le .jar attache : c'est le lien direct a donner au createur du serveur.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
